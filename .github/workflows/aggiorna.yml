name: Aggiorna PhantaCassandra

on:
  schedule:
    # Giri di RISERVA, nel caso cron-job.org non parta: in Italia alle 11:55, 14:25, 17:25, 17:55, 20:10.
    # Se cron-job.org ha già aggiornato da meno di 25 minuti, il giro viene saltato.
    # GitHub usa solo l'ora UTC: ogni orario è scritto due volte (ora solare e ora legale) e
    # scraper/run.js tiene solo quello giusto per l'ora italiana. Non serve cambiare nulla a marzo e ottobre.
    # ora solare (UTC+1)
    - cron: "55 10 * * *"
    - cron: "25 13 * * *"
    - cron: "25 16 * * *"
    - cron: "55 16 * * *"
    - cron: "10 19 * * *"
    # ora legale (UTC+2)
    - cron: "55 9 * * *"
    - cron: "25 12 * * *"
    - cron: "25 15 * * *"
    - cron: "55 15 * * *"
    - cron: "10 18 * * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "manuale o automatico"
        required: false
        default: "manuale"

permissions:
  contents: write

concurrency:
  group: aggiorna
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # immagine con il browser già installato: niente installazione a ogni giro
    container: mcr.microsoft.com/playwright:v1.48.2-jammy
    steps:
      - name: Prepara git
        run: command -v git >/dev/null || (apt-get update -qq && apt-get install -y -qq git >/dev/null)
      - uses: actions/checkout@v4
      - name: Prepara il lettore
        run: npm install --no-save --no-audit --no-fund playwright@1.48.2
      - name: Leggi i siti
        env:
          EVENT: ${{ github.event_name }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && (inputs.modo || 'manuale') || 'automatico' }}
          HOME: /root
        run: node scraper/run.js
      - name: Salva i dati
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "PhantaCassandra"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data.json docs/ultimo-giro.txt 2>/dev/null || git add docs/data.json
          git diff --cached --quiet || git commit -m "Aggiornamento formazioni $(TZ=Europe/Rome date '+%d/%m %H:%M')"
          git pull --rebase -q || true
          git push
