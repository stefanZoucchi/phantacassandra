name: Salva statistiche Sportmediaset

# Avviato dalla pagina: riceve solo i conteggi (titolari indovinati / totali) della colonna SPM,
# non le formazioni di Sportmediaset, e li aggiunge a docs/spm-stats.json per la classifica delle fonti.
on:
  workflow_dispatch:
    inputs:
      stats:
        description: '{"giornata":9,"hits":50,"total":66,"teams":6}'
        required: true

permissions:
  contents: write

concurrency:
  group: spm
  cancel-in-progress: false

jobs:
  salva:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Aggiorna docs/spm-stats.json
        env:
          STATS: ${{ inputs.stats }}
        run: |
          node -e '
            const fs = require("fs"), f = "docs/spm-stats.json";
            const s = JSON.parse(process.env.STATS);
            const g = String(parseInt(s.giornata)), hits = parseInt(s.hits), total = parseInt(s.total), teams = parseInt(s.teams);
            if (!(g > 0) || !(total > 0) || hits < 0 || hits > total || !(teams > 0) || teams > 20) throw new Error("dati non validi");
            const all = fs.existsSync(f) ? JSON.parse(fs.readFileSync(f, "utf8")) : {};
            all[g] = { hits, total, teams };
            fs.writeFileSync(f, JSON.stringify(all));
            console.log("Giornata " + g + ": " + hits + "/" + total + " su " + teams + " squadre");
          '
      - name: Salva
        run: |
          git config user.name "PhantaCassandra"
          git config user.email "actions@users.noreply.github.com"
          git add docs/spm-stats.json
          git diff --cached --quiet || git commit -m "Statistiche Sportmediaset"
          git pull --rebase -q || true
          git push
